# Rendezvous dev relay. Derived from the strfry default config; only deviations are set.
db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536                          # ~64 KB per event
    rejectEventsNewerThanSeconds = 900            # 15 min clock skew
    rejectEventsOlderThanSeconds = 94608000       # 3 years
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"   # inside the container; host publishing is restricted in docker-compose.yml
    port = 7777
    nofiles = 524288
    realIpHeader = "cf-connecting-ip"

    auth {
        enabled = false
        serviceUrl = ""
        restrictedReadKinds = ""
        restrictReadToInvolvedPubkey = false
    }

    info {
        name = "Rendezvous dev relay"
        description = "Rendezvous dev relay"
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55        # below Cloudflare's 100 s idle timeout
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        plugin = ""
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
