services:
  strfry:
    # Pinned by digest (the image publishes only :latest; watchtower must not float it).
    # strfry 1.1.2-148-g4cd3cf6, pulled 2026-10-25.
    image: ghcr.io/hoytech/strfry@sha256:36f1886d185a88ca57c66ebe52e6e9e8428dac2486eea0a5d50ff934f18b60c3
    container_name: rendezvous-relay
    restart: unless-stopped
    command: ["--config=/etc/strfry.conf", "relay"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      # Bind addresses come from .env (see .env.example). Both default to loopback,
      # so an unconfigured host never exposes the relay. Never use 0.0.0.0.
      - "127.0.0.1:7777:7777"
      - "${RELAY_BIND_TAILNET:-127.0.0.1}:${RELAY_PORT_TAILNET:-17777}:7777"   # private network (e.g. tailnet IP)
      - "${RELAY_BIND_LAN:-127.0.0.1}:${RELAY_PORT_LAN:-27777}:7777"           # LAN: where a tunnel connector reaches the relay
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - ./data:/app/strfry-db   # local disk only: LMDB must not live on the CIFS NAS
