services:
  site:
    # Pinned by digest so watchtower or a re-pull cannot float it. nginx 1.30.6-alpine (stable line).
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: rendezvous-site
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "127.0.0.1:7778:80"
      - "<lan-ip>:7778:80"   # LAN: the tunnel connector reaches the host here
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../../../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
