# rendezvous.nesher.co: static site plus the install scripts.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript image/svg+xml;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # The installers are read by curl/irm and by people: serve them as plain text,
    # never cached for long, so a fix reaches the next install.
    location = /install.sh {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /install.ps1 {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The logo SVGs switch colours for dark mode with an internal <style>, which
    # the page CSP would block in browsers that apply it to SVG images.
    location ~* \.svg$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Assets are not fingerprinted, so keep caching short.
    location ~* \.(?:css|js|woff2|png|txt)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # Nothing else in the mounted directory is meant to be served.
    location ~ /\. {
        deny all;
        return 404;
    }
}
